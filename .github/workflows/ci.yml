name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-learning-coach/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ai-learning-coach/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff bandit pip-audit

      - name: Lint backend (Ruff)
        working-directory: ai-learning-coach/backend
        run: python -m ruff check app
        continue-on-error: true

      - name: Backend tests (pytest)
        working-directory: ai-learning-coach/backend
        run: python -m pytest
        continue-on-error: true

      - name: Security scan (Bandit)
        working-directory: ai-learning-coach/backend
        run: python -m bandit -q -r app
        continue-on-error: true

      - name: Dependency audit (pip-audit)
        working-directory: ai-learning-coach/backend
        run: python -m pip_audit -r requirements.txt || true

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ai-learning-coach/frontend/package-lock.json

      - name: Install frontend dependencies (ci fallback)
        working-directory: ai-learning-coach/frontend
        run: |
          echo "Running npm ci..."
          if ! npm ci; then
            echo "npm ci failed, trying npm install..."
            rm -rf node_modules
            npm install
          fi

      - name: Frontend tests (Jest)
        working-directory: ai-learning-coach/frontend
        env:
          CI: true
        run: npm test -- --watch=false --runInBand --passWithNoTests
        continue-on-error: true

      - name: Frontend production build
        working-directory: ai-learning-coach/frontend
        env:
          CI: false  # allow eslint warnings without failing the build
        run: npm run build
